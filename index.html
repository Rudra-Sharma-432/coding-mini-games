
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Games | Programming Challenges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>mini-games</h2>
        <span>Programming Practice</span>
    </header>

    <main>
        <section class="intro">
            <h1>Programming Challenges</h1>
            <p>Choose a challenge and build something yourself.</p>
        </section>

        <section class="filters">
            <input type="search" placeholder="Search challenges...">

            <select>
                <option value="">All Languages</option>
                <option>JavaScript</option>
                <option>Python</option>
            </select>

            <select>
                <option value="">All Difficulties</option>
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>
        </section>

        <section class="problems">
            <h3>Problem Set</h3>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Challenge</th>
                        <th>Difficulty</th>
                        <th>Language</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>001</td>
                        <td>
                            <a href="./web/01_aim-trainer/">
                                Aim Trainer
                            </a>
                            <small>Build a reaction and aiming game.</small>
                        </td>
                        <td class="easy">Easy</td>
                        <td>JavaScript</td>
                    </tr>

                    <tr>
                        <td>002</td>
                        <td>
                            <a href="./python/01_number-guessing/">
                                Number Guessing
                            </a>
                            <small>Create a number guessing game.</small>
                        </td>
                        <td class="easy">Easy</td>
                        <td>Python</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
